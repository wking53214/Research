[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stack-research-lab"
dynamic = ["version"]  # one source of truth: research_lab.__version__
description = "A governed research laboratory: objectives, questions, hypotheses, evidence, experiments, findings and proposals kept as a durable, tamper-evident, resumable research graph."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "William N. King" }]
keywords = ["research", "provenance", "hash-chain", "governance", "evidence"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# Core is standard library only. tests/test_repo_hygiene.py reads the source to enforce it.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
research-lab = "research_lab.cli:main"

[tool.setuptools.dynamic]
version = { attr = "research_lab.__version__" }

[tool.setuptools.packages.find]
include = ["research_lab*"]

[tool.setuptools.package-data]
research_lab = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
"examples/**" = ["E402"]
